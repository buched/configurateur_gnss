<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Installateur Balance SOSH</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f4f7f9; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
        button { background: #007bff; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Balance SOSH</h1>
        <p>Installation du micrologiciel</p>

        <script type="module">
          import "https://esm.sh/esp-web-tools@10";
        </script>

        <esp-web-install-button manifest="manifest.json">
            <button slot="activate">CONNECTER ET INSTALLER</button>
            <div slot="unsupported">
                ⚠️ Erreur : Le script de flashage n'a pas pu charger.<br>
                Vérifiez votre connexion ou utilisez Chrome/Edge.
            </div>
        </esp-web-install-button>
    </div>

</body>
</html>
