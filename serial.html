<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Configurateur GNSS / Balance SOSH</title>
<style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f7f9; }
        
        .container { 
            display: flex; 
            flex-wrap: wrap;      /* Permet aux cartes de passer à la ligne */
            justify-content: center; 
            gap: 20px; 
            margin: 30px auto;
            max-width: 600px;     /* Limite la largeur pour forcer le passage à la ligne après 2 cartes */
        }

        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            /* On calcule la largeur : (50% de la ligne) moins l'espace du gap */
            width: calc(50% - 20px); 
            min-width: 250px;     /* Garde une taille lisible sur petit écran */
            box-sizing: border-box; 
        }

        h3 { margin-top: 0; color: #333; font-size: 1.1rem; }
        span { display: block; margin-top: 15px; font-size: 12px; color: #666; }

        /* Optionnel : Sur téléphone très étroit, on repasse à 1 carte par ligne */
        @media (max-width: 580px) {
            .card { width: 100%; }
        }
    </style>
</head>
<body>

    <h1>Sélection du Firmware - Balance SOSH</h1>
    <p>Choisissez la version adaptée à votre matériel :</p>

    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

    <div class="container">
			<div class="card">
            <h3>générique auto / sosh</h3>
            <esp-web-install-button manifest="manifest_imei.json"></esp-web-install-button>
        </div>
		
        <div class="card">
            <h3>0787273403 / sosh</h3>
            <esp-web-install-button manifest="manifest_0787273403.json"></esp-web-install-button>
        </div>

        <div class="card">
            <h3>0687079533 / sosh</h3>
            <esp-web-install-button manifest="manifest_0687079533.json"></esp-web-install-button>
        </div>
		
		<div class="card">
            <h3>0759773698 / sosh reglo de base</h3>
            <esp-web-install-button manifest="manifest_0759773698.json"></esp-web-install-button>
        </div>
		
		<div class="card">
            <h3>0671506458 / sosh</h3>
            <esp-web-install-button manifest="manifest_0671506458.json"></esp-web-install-button>
        </div>
    </div>

    <br><br>
    <span>NOTE : Fermez l'IDE Arduino ou tout moniteur série avant de lancer le flashage.</span>

</body>
</html>
