<!DOCTYPE html>
<html>


<body>
    <h1>Sample project for demoing ESP Web Tools</h1>

<div class="container">
        <div class="card">
            <h3>Version 3403</h3>
            <p>Firmware standard pour module 3403</p>
            <esp-web-install-button manifest="manifest_3403.json"></esp-web-install-button>
        </div>

        <div class="card">
            <h3>Version 9533</h3>
            <p>Firmware alternatif pour module 9533</p>
            <esp-web-install-button manifest="manifest_9533.json"></esp-web-install-button>
        </div>
    </div>
    

    <script>
        if(navigator.serial){
            document.getElementById("notSupported").style.display = 'none';
            document.getElementById("main").style.display = 'block';
        } else {
            document.getElementById("notSupported").style.display = 'block';
            document.getElementById("main").style.display = 'none';
        }
    </script>

</body>

</html>
