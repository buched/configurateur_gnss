<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Installateur Balance SOSH</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f0f2f5; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #1c1e21; margin-bottom: 10px; }
        p { color: #606770; margin-bottom: 30px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Balance SOSH</h1>
        <p>Installation du micrologiciel v1.0</p>

        <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web-tools.js?module"></script>

        <esp-web-install-button manifest="manifest.json">
            <button slot="activate" style="background: #007bff; color: white; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold;">
                CONNECTER ET INSTALLER
            </button>
            <span slot="unsupported">Désolé, Web Serial n'est pas disponible ici.</span>
        </esp-web-install-button>
    </div>

</body>
</html>
